name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validator tests
        run: python3 -m unittest discover -s tools -v
      - name: Validate every dataset in the catalog
        run: python3 tools/validate.py --catalog data/catalog.json
